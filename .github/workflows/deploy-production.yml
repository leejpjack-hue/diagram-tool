name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy diagram.teqcon.uk
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload dist to temporary folder
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && rm -rf .deploy-dist-new && mkdir .deploy-dist-new"
          sshpass -e rsync -az --delete dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.deploy-dist-new/"
          sshpass -e rsync -az --delete server/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/server/"
          sshpass -e rsync -az vite.config.ts "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/vite.config.ts"

      - name: Activate build and restart service
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            # Pin SHARE_STORE_DIR outside dist/. rsync --delete server/ and the
            # atomic dist swap must not wipe published view-link tokens.
            SHARE_STORE_DIR=/var/lib/diagram-tool/share-store
            if ! mkdir -p \"\$SHARE_STORE_DIR\" 2>/dev/null || [ ! -w \"\$SHARE_STORE_DIR\" ]; then
              SHARE_STORE_DIR='$DEPLOY_PATH/share-store'
              mkdir -p \"\$SHARE_STORE_DIR\"
            fi
            unit='$DEPLOY_SERVICE'
            case \"\$unit\" in
              *.service) drop=\"\$unit.d\" ;;
              *) drop=\"\$unit.service.d\" ;;
            esac
            mkdir -p \"\$HOME/.config/systemd/user/\$drop\"
            printf '[Service]\\nEnvironment=SHARE_STORE_DIR=%s\\n' \"\$SHARE_STORE_DIR\" > \"\$HOME/.config/systemd/user/\$drop/share-store.conf\"
            systemctl --user daemon-reload
            cd '$DEPLOY_PATH'
            test -f .deploy-dist-new/index.html
            stamp=\$(date +%Y%m%d%H%M%S)
            cp -a dist \"dist.backup.\$stamp\"
            rm -rf dist.previous
            mv dist dist.previous
            mv .deploy-dist-new dist
            rm -rf dist.previous
            systemctl --user restart '$DEPLOY_SERVICE'
            systemctl --user is-active '$DEPLOY_SERVICE'
          "
